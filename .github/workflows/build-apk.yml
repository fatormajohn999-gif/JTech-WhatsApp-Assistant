name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate assets from logo SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/icon-only.png
          cp assets/icon-only.png assets/icon-foreground.png
          cp assets/icon-only.png assets/icon.png
          rsvg-convert -w 2732 -h 2732 assets/logo.svg -o assets/splash.png
          mkdir -p public
          rsvg-convert -w 192 -h 192 public/logo.svg -o public/icon-192.png
          rsvg-convert -w 512 -h 512 public/logo.svg -o public/icon-512.png
          rsvg-convert -w 512 -h 512 public/logo.svg -o public/icon-maskable-512.png
          rsvg-convert -w 180 -h 180 public/logo.svg -o public/apple-touch-icon.png

      - name: Build web assets with Vite
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Add Android platform and sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jtech-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Update GitHub Release (Latest APK)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: 'Latest APK (debug)'
          body: 'Latest Android APK debug build for JTech Assistant generated automatically by GitHub Actions.'
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
