name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Generate PWA PNG icons from SVG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 192 -h 192 public/logo.svg -o public/icon-192.png
          rsvg-convert -w 512 -h 512 public/logo.svg -o public/icon-512.png
          rsvg-convert -w 512 -h 512 public/logo.svg -o public/icon-maskable-512.png
          rsvg-convert -w 180 -h 180 public/logo.svg -o public/apple-touch-icon.png

      - name: Build frontend with Vite
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
